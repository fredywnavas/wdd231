<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Fredy Navas">
    <title>FreeFlicks</title>
    <meta name="description"
        content="This website contains movies that are totally legal and free to watch online due to public domain and some are ad supported.">

        <!--LINK FILES-->
    <link rel="stylesheet" href="styles/freeflicks.css">
    <link rel="stylesheet" href="styles/freeflicks-large.css">
    <script type="module" src="scripts/main.js"></script>
    <script src="scripts/getdates.js" defer></script>


    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

</head>

<body>

    <!--MENU TO THE OTHER PAGES-->
    <nav id="link-nav">
        <button type="button" class="hamburger" aria-label="Menu" aria-expanded="false">☰</button>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="suggestions.html">Suggestions</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>



    <header>
        <div class="header-brand">
            <a href="index.html"> <img src="images/ff-logo.webp" alt="FreeFlicks logo"></a>
            <button id="theme-toggle">🌙</button>
            <h1>Public Domain Films Suggestions</h1>
        </div>

    </header>

    <main>
        <form class="suggestion-form" action="form-results.html" method="get">
            <div class="form-row">
                <label for="movie-title">Movie Title</label>
                <input type="text" id="movie-title" name="movie-title" required>
            </div>
            
            <div class="form-row">
                <label for="movie-genre">Movie Genre</label>
                <input type="text" id="movie-genre" name="movie-genre" required>
            </div>

            <div class="form-row">
                <label for="comment">Comment</label>
                <textarea id="comment" name="comment" required></textarea>
            </div>
            
            <div class="form-row">
                <label for="user-name">Your Name</label>
                <input type="text" id="user-name" name="user-name" required>
            </div>
            
            <button type="submit">Submit</button>

        </form>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> Fredy Navas, California, USA.
        </p>

        <p id="lastModified"></p>
    </footer>

</body>





</html>
